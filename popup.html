<!DOCTYPE html>
<html>
<head>
  <title>Real Estate Survey</title>
</head>
<body>
  <h3>Rate Your Preferences</h3>
  <form id="surveyForm">
    <label for="school">School Importance (1-10):</label>
    <input type="range" id="school" name="school" min="1" max="10"><br><br>

    <label for="crime">Crime Concern (1-10):</label>
    <input type="range" id="crime" name="crime" min="1" max="10"><br><br>

    <label for="income">Your Income:</label>
    <input type="number" id="income" name="income"><br><br>

    <label for="transportation">Public Transportation Importance:</label>
    <input type="text" id="transportation" name="transportation"><br><br>

    <label for="foodChoices">Healthy Food Choices (Yes/No):</label>
    <input type="text" id="foodChoices" name="foodChoices"><br><br>

    <label for="naturalDisasters">Concern about Natural Disasters:</label>
    <input type="text" id="naturalDisasters" name="naturalDisasters"><br><br>

    <button type="submit">Submit</button>
  </form>

  <script src="popup.js"></script>
</body>
</html>
